; Interactive cat robot - TOP layer
; ESP32 + 1.3" OLED (face) + TTP223 touch + MAX98357A I2S speaker + microSD (sounds)
; Talks to the bottom layer (robot_avoider) over UART2.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.0
; Add -DUSE_SSD1306 if your OLED is an SSD1306 instead of SH1106
build_flags =
