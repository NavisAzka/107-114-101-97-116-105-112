; Obstacle-avoiding differential-drive robot
; ESP32 + L298N + 2x DC motor + 3x HC-SR04

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Real hardware
[env:esp32]

; Wokwi simulation (same pinout, motors shown as LEDs)
[env:wokwi]
build_flags = -DWOKWI_SIM
