; Animated eyes on a 1.3" I2C OLED + TTP223 capacitive touch

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.0

; Real hardware: 1.3" OLED modules use the SH1106 controller
[env:esp32]

; Wokwi simulation: only SSD1306 is available there
[env:wokwi]
build_flags = -DUSE_SSD1306
